name: KT-23960 validation

# Temporary workflow used only to validate the KT-23960 change on the fork.
# It must not be promoted to the PR branch.

on:
  push:
    branches:
      - KT-23960-empty-string-concat
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jvm-bytecode-text:
    name: JVM bytecode text tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The Kotlin build requires several JDKs: 21 for the Gradle daemon,
      # 8 for the test launcher, and 11/17 as extra toolchains.
      - name: Set up JDK 8
        id: jdk8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 11
        id: jdk11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up JDK 17
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up JDK 21
        id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run bytecode text tests
        env:
          JAVA_HOME: ${{ steps.jdk21.outputs.path }}
          JDK_1_8: ${{ steps.jdk8.outputs.path }}
          JDK_11_0: ${{ steps.jdk11.outputs.path }}
          JDK_17_0: ${{ steps.jdk17.outputs.path }}
          JDK_21_0: ${{ steps.jdk21.outputs.path }}
        run: >
          ./gradlew :compiler:fir:fir2ir:test
          --tests "org.jetbrains.kotlin.test.runners.codegen.FirLightTreeBytecodeTextTestGenerated*"
          -Pkotlin.test.xmx=2g
          --stacktrace
